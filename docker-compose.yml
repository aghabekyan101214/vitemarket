# Local development stack.
#   docker compose up -d                       # core stack
#   docker compose --profile tools up -d       # + Adminer DB UI
#   docker compose run --rm api pytest         # tests (uses showcase_test DB)
#   docker compose run --rm api python -m app.cli seed
#
# Object storage: SeaweedFS speaks the S3 API, the same API Cloudflare R2 exposes.
# The backend only knows "an S3 endpoint + bucket + public base URL", so switching
# to R2 in production is just environment variables.

name: showcase

x-backend-env: &backend-env
  APP_ENV: local
  LOG_LEVEL: DEBUG
  LOG_FORMAT: console
  DATABASE_URL: postgresql+asyncpg://showcase:showcase@db:5432/showcase
  TEST_DATABASE_URL: postgresql+asyncpg://showcase:showcase@db:5432/showcase_test
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "5"
  JWT_SECRET: local-dev-jwt-secret-change-me-0123456789
  JWT_ACCESS_TTL_MINUTES: "60"
  CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:3001
  # --- object storage (SeaweedFS locally, R2 in prod) ---
  STORAGE_ENDPOINT_URL: http://storage:8333
  STORAGE_REGION: us-east-1
  STORAGE_ACCESS_KEY_ID: local-access-key
  STORAGE_SECRET_ACCESS_KEY: local-secret-key
  STORAGE_BUCKET: media
  STORAGE_PUBLIC_BASE_URL: http://localhost:8333/media
  IMAGE_TRANSFORM_PROVIDER: none          # "cloudflare" in prod
  UPLOAD_MAX_BYTES: "10485760"
  # --- publishing ---
  REVALIDATE_WEBHOOK_URL: http://webhook-sink:8080/api/revalidate
  REVALIDATE_WEBHOOK_SECRET: local-webhook-secret
  CDN_PURGE_PROVIDER: none                # "cloudflare" in prod
  PUBLISH_DEBOUNCE_SECONDS: "5"

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: showcase
      POSTGRES_PASSWORD: showcase
      POSTGRES_DB: showcase
    ports:
      - "${DB_HOST_PORT:-5432}:5432"   # set DB_HOST_PORT in .env if 5432 is taken
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/ — mount the parent.
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showcase -d showcase"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    image: chrislusf/seaweedfs:4.53
    command: >
      server
      -dir=/data
      -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=256
      -volume.max=0
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"   # S3 API + public object URLs
      - "9333:9333"   # master UI (debugging)
    volumes:
      - storagedata:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # One-shot: create the bucket (idempotent). R2 bucket is created once in the CF dashboard/Terraform.
  storage-init:
    image: amazon/aws-cli:2.40.0
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: local-access-key
      AWS_SECRET_ACCESS_KEY: local-secret-key
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          aws --endpoint-url http://storage:8333 s3api head-bucket --bucket media 2>/dev/null && { echo "bucket exists"; exit 0; }
          aws --endpoint-url http://storage:8333 s3api create-bucket --bucket media && { echo "bucket created"; exit 0; }
          sleep 2
        done
        exit 1
    restart: "no"

  migrate:
    build:
      context: ./backend
      target: dev
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      target: dev
    environment: *backend-env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]
    ports:
      - "8000:8000"   # http://localhost:8000/docs
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Publishing worker: drains publish_jobs (Postgres queue, SKIP LOCKED) -> revalidate webhook -> CDN purge.
  worker:
    build:
      context: ./backend
      target: dev
    environment: *backend-env
    command: ["watchfiles", "--filter", "python", "python -m app.worker", "app"]
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Stand-in for the Next.js revalidation endpoint: logs every webhook the worker sends.
  #   docker compose logs -f webhook-sink
  webhook-sink:
    image: mendhak/http-https-echo:43
    environment:
      HTTP_PORT: "8080"
      LOG_IGNORE_PATH: /health
    ports:
      - "8081:8080"

  adminer:
    image: adminer:6.3.0-standalone
    profiles: ["tools"]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8082:8080"
    depends_on:
      - db

volumes:
  pgdata:
  storagedata:
