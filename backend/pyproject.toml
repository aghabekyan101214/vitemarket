[project]
name = "showcase-api"
version = "0.1.0"
description = "Multi-tenant backend for product showcase websites"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.35",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "structlog>=25.4",
    "orjson>=3.10",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "argon2-cffi>=25.1",
    "idna>=3.10",
    "pyjwt>=2.10",
    "dnspython>=2.7",
    "nh3>=0.3",
    "boto3>=1.40",
    "pillow>=11.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
    "mypy>=1.17",
    "watchfiles>=1.1",
    "types-boto3[s3]>=1.40",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs external services (S3 storage)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF", "SIM", "PT"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]
