# Host nginx in front of the API container (TLS termination + login rate limit).
# Installed by infra/scripts/server-setup.sh as /etc/nginx/sites-available/showcase-api.
# The API listens on 127.0.0.1:8000 only (docker-compose.prod.yml), so nginx is the only way in.
#
# Hostname: api.2-29-168-64.sslip.io is a temporary name (sslip.io resolves it to the VM's IP).
# To move to a real domain: replace the hostname everywhere in this file, issue a certificate
# (certbot certonly --webroot -w /var/www/certbot -d <host>), then `nginx -t && systemctl reload nginx`.

upstream showcase_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Brute-force guard for the admin login (the app also locks accounts and rate-limits per IP).
limit_req_zone $binary_remote_addr zone=showcase_login:10m rate=10r/m;

# Anything that is not our hostname (scanners hitting the bare IP) is dropped.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.2-29-168-64.sslip.io;

    # Let's Encrypt HTTP-01 challenges (certbot --webroot, renewed by certbot.timer).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.2-29-168-64.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/api.2-29-168-64.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.2-29-168-64.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:showcase_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    # The app enforces the exact limits (MAX_REQUEST_BYTES, UPLOAD_MAX_BYTES = 10 MiB) and
    # answers 413 itself; this only stops anything far larger at the edge.
    client_max_body_size 12m;
    # HSTS, nosniff, X-Frame-Options etc. are set by the API middleware (APP_ENV=production).

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location = /admin/v1/auth/login {
        limit_req zone=showcase_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://showcase_api;
    }

    location / {
        proxy_pass http://showcase_api;
    }
}
