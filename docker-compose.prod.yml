# Production stack (single VM / small cluster of VMs).
#   cp .env.prod.example .env.prod   # fill in secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Traffic path:  Cloudflare edge -> Cloudflare Tunnel (cloudflared) -> api:8000
# No host ports are published; the VM needs only outbound internet.
# Images/media live in Cloudflare R2 (no storage container here).
# Visitors hit the statically generated Next.js sites, not this API.

name: showcase-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-backend: &backend
  image: ${API_IMAGE:?set API_IMAGE}:${API_TAG:?set API_TAG}
  build:
    context: ./backend
    target: prod
  env_file: .env.prod
  environment:
    APP_ENV: production
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  logging: *logging
  restart: unless-stopped

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c max_connections=100
      -c random_page_cost=1.1
      -c log_min_duration_statement=500
      -c shared_preload_libraries=pg_stat_statements
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb
    logging: *logging
    restart: unless-stopped

  # Nightly logical backups with rotation. Sync ./backups off-box — see docs/runbooks/backup-restore.md.
  db-backup:
    image: prodrigestivill/postgres-backup-local:18-alpine
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: "-Z9 --schema=public --blobs"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      HEALTHCHECK_PORT: "8080"
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  # Cloudflare Tunnel: route e.g. api.<your-admin-domain> -> http://api:8000 in the CF dashboard.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?}
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

volumes:
  pgdata:
