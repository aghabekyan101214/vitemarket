# Frontend CI: typecheck, lint, unit tests, OpenAPI type drift, build, e2e (mock mode),
# Lighthouse CI (mobile, ≥ 90). See frontend/README.md.
name: frontend

on:
  pull_request:
    paths: ["frontend/**", "backend/app/**", ".github/workflows/frontend.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", "backend/app/**", ".github/workflows/frontend.yml"]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  SHOWCASE_API_MODE: mock
  APP_ENV: local
  REVALIDATE_WEBHOOK_SECRET: local-webhook-secret
  NEXT_PUBLIC_IMAGE_PROVIDER: none

defaults:
  run:
    working-directory: frontend

jobs:
  checks:
    name: types · lint · unit · drift · build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.30"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: OpenAPI types match the backend
        run: npm run check:types
      - run: npm run build

  e2e:
    name: e2e (Playwright, mock mode)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse CI (mobile)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx --yes @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: frontend/.lighthouseci
          retention-days: 7
